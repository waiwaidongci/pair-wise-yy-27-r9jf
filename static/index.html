<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数字人文文本校勘</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f5ef}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #d6d0c4;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#5b3d22;color:#fff}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.ed{border-left:4px solid #5b3d22;background:#f3ede2;padding:6px 10px;margin:6px 0;border-radius:6px}.dr{border-left:4px solid #8a8f6a;background:#f5f6ee;padding:6px 10px;margin:6px 0;border-radius:6px}.tag{font-size:12px;color:#fff;border-radius:4px;padding:1px 6px;margin-right:6px}.t-ed{background:#5b3d22}.t-dr{background:#8a8f6a}.muted{color:#777;font-size:13px}.ro{color:#8a5a2b;font-size:12px}</style><h1>数字人文文本校勘</h1><section><button onclick="state()">刷新状态</button><pre id="state"></pre></section><section><h2>段落与版本对齐</h2><div class="grid"><input id="work" type="number" placeholder="作品 ID"><input id="passage" type="number" placeholder="段落 ID"><input id="witness" type="number" placeholder="版本 ID"><input id="user" type="number" placeholder="用户 ID"><input id="order" type="number" value="1"><textarea id="text" placeholder="对齐文本">春水东流，[缺页]</textarea></div><button onclick="align()">保存对齐</button><pre id="result"></pre></section><section><h2>异文多层修订</h2><input id="variant" type="number" placeholder="异文 ID"><input id="revision" type="number" value="0" placeholder="当前修订"><input id="reason" placeholder="取舍理由"><textarea id="proposed" placeholder="拟订文本"></textarea><button onclick="variant()">新增异文</button><button onclick="revise()">提交新层</button><button onclick="snapshot()">查看快照</button><button onclick="lock()">锁定段落</button><pre id="extra"></pre></section><section><h2>定本发布</h2><div class="grid"><input id="ework" type="number" placeholder="作品 ID"><input id="euser" type="number" placeholder="发布负责人 ID"><input id="enote" placeholder="本版说明，如：评审会第二轮定稿"></div><button onclick="publishEdition()">从当前修订发布定本</button>
<button onclick="loadEditions()">刷新定本与时间线</button><div id="draftTip" class="muted"></div><h3>历史定本（只读）</h3><div id="editionList"></div><h3>定本与草稿修订时间线</h3><div id="timeline"></div><pre id="editionView"></pre></section><script>const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);async function get(u,e='#result'){show(e,await(await fetch(u)).json())}async function post(u,b,e='#result'){show(e,await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json())}async function state(){show('#state',await(await fetch('/api/state')).json())}function align(){post('/api/alignments',{passage_id:+passage.value,witness_id:+witness.value,aligned_text:text.value,sort_order:+order.value,user_id:+user.value})}function variant(){post('/api/variants',{passage_id:+passage.value,witness_id:+witness.value,proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value})}function revise(){post('/api/variants/'+variant.value+'/revisions',{proposed_text:proposed.value,reason:reason.value,user_id:+user.value,expected_revision:+revision.value},'#extra')}function snapshot(){get('/api/passages/'+passage.value+'/snapshots/'+revision.value+'?user_id='+user.value,'#extra')}function lock(){post('/api/passages/'+passage.value+'/lock',{user_id:+user.value,reason:'版本已定稿'},'#extra')}
async function publishEdition(){const r=await(await fetch('/api/works/'+ework.value+'/editions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note:enote.value,user_id:+euser.value})})).json();show('#editionView',r);if(r.ok){enote.value='';loadEditions()}}
async function viewEdition(id){get('/api/editions/'+id+'?user_id='+(euser.value||user.value),'#editionView')}
async function loadEditions(){
 const wid=ework.value||work.value;if(!wid){document.querySelector('#draftTip').textContent='请先填写作品 ID';return}
 const d=await(await fetch('/api/works/'+wid+'/editions?user_id='+(euser.value||user.value||0))).json();
 if(d.error){show('#editionView',d);return}
 document.querySelector('#draftTip').textContent=d.has_draft_changes?'当前草稿含上一定本之后的新修订，可发布新定本。':'当前各段落没有新修订，不能重复发布定本。';
 document.querySelector('#editionList').innerHTML=d.editions.length?d.editions.map(e=>'<div class="ed"><span class="tag t-ed">定本 v'+e.version_no+'</span><span class="ro">只读</span> '+new Date(e.published_at).toLocaleString()+' · '+e.publisher_name+'<br><span class="muted">'+e.note+'</span><br><span class="muted">对齐 '+e.alignment_count+' · 异文 '+e.variant_count+' · 注释 '+e.note_count+' · 缺口 '+e.gap_count+'</span> <button onclick="viewEdition('+e.id+')">回看定本</button></div>').join(''):'<div class="muted">尚未发布定本。</div>';
 document.querySelector('#timeline').innerHTML=d.timeline.map(t=>t.kind==='edition'?'<div class="ed"><span class="tag t-ed">定本</span>'+new Date(t.at).toLocaleString()+' '+t.label+' · 对齐/异文/注释/缺口见卡片 · 缺口 '+t.gap_count+' <button onclick="viewEdition('+t.edition_id+')">回看</button><br><span class="muted">'+t.note+'</span></div>':'<div class="dr"><span class="tag t-dr">'+(t.is_draft?'草稿':'已冻结')+'</span>'+new Date(t.at).toLocaleString()+' '+t.label+' · '+t.author_name+'</div>').join('')||'<div class="muted">暂无记录。</div>';
}
state();loadEditions()</script></html>
